name: CI Quality Gate

# Note: Once the PAT or GitHub Actions has 'workflow' scope permission,
# copy this file to .github/workflows/ci.yml

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Static type check (all workspaces)
        run: npm run typecheck

      - name: Run unit test suite
        run: npm test

      - name: Build Customer Web Portal
        run: npm run build --workspace=@10min-help/customer-web

      - name: Build Admin Operations Portal
        run: npm run build --workspace=@10min-help/admin-web
